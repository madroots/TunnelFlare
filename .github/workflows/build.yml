name: Build AppImage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-venv patchelf desktop-file-utils libgdk-pixbuf2.0-dev

    - name: Install linuxdeploy
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-python/releases/download/continuous/linuxdeploy-plugin-python-x86_64.AppImage
        chmod +x linuxdeploy-plugin-python-x86_64.AppImage

    - name: Build AppImage
      run: |
        # Initialize AppDir
        mkdir -p AppDir
        
        # Install application and dependencies into AppDir
        # We manually install into the standard python path structure within AppDir
        # This is often more robust than relying on the plugin to resolve '.'
        
        SITE_PACKAGES=AppDir/usr/lib/python3.10/site-packages
        mkdir -p $SITE_PACKAGES
        
        export PYTHONPATH=$SITE_PACKAGES
        pip3 install --target $SITE_PACKAGES .
        
        # Cleanup unnecessary info (optional)
        rm -rf $SITE_PACKAGES/*.dist-info
        
        # Run linuxdeploy
        # --icon-file is the correct flag (not --icon)
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --plugin python \
          --desktop-file tunnelflare.desktop \
          --icon-file gui/resources/tray.svg \
          --output appimage

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TunnelFlare-AppImage
        path: TunnelFlare*.AppImage
