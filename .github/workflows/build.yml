name: Build TunnelFlare

on:
  push:
    branches: [main, windows-compatibility]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Qt's xcb platform plugin and its X11 helper libraries (bundled into the
  # AppImage from the build host), plus the tools the packaging needs.
  LINUX_QT_PACKAGES: >-
    libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
    libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
        python: ["3.14"]
        include:
          - os: ubuntu-22.04
            python: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_QT_PACKAGES
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .
      - name: Unit and GUI tests
        run: python -m pytest -v
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    name: Package ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: macos-arm64
            os: macos-15
          - target: macos-x86_64
            os: macos-15-intel
          - target: windows-x64
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_QT_PACKAGES zsync xvfb xauth
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import tunnelflare_backend; print(tunnelflare_backend.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
      - name: Build
        run: python packaging/build.py --target ${{ matrix.target }}
      - name: Test the packaged app (self-test + real quick tunnel)
        run: python packaging/smoke_test.py --target ${{ matrix.target }} --e2e --e2e-attempts 3
      - name: Upload artifacts, self-test reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TunnelFlare-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: TunnelFlare-*
          path: artifacts
      - name: Collect release files and checksums
        run: |
          mkdir release
          find artifacts -type f \( -name '*.AppImage' -o -name '*.AppImage.zsync' -o -name '*.dmg' \
            -o -name '*-setup.exe' -o -name '*-portable.zip' \) -exec cp {} release/ \;
          for pattern in '*.AppImage' '*-macos-arm64.dmg' '*-macos-x86_64.dmg' '*-setup.exe' '*-portable.zip'; do
            compgen -G "release/$pattern" > /dev/null || { echo "::error::Missing release file $pattern"; exit 1; }
          done
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Write release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          cloudflared=$(python3 -c "import json; print(json.load(open('packaging/cloudflared.json'))['version'])")
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{CLOUDFLARED_VERSION}}/$cloudflared/g" \
            .github/release-notes.md > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "TunnelFlare ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --generate-notes
