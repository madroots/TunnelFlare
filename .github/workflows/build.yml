name: Build AppImage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2 file desktop-file-utils

    - name: Setup AppImage Tool
      run: |
        wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

    - name: Prepare AppDir (Niess Python Base)
      run: |
        # Download Base Image (Python 3.9 via Niess)
        wget https://github.com/niess/python-appimage/releases/download/python3.9/python3.9.25-cp39-cp39-manylinux2014_x86_64.AppImage -O python.AppImage
        chmod +x python.AppImage
        
        # Extract
        ./python.AppImage --appimage-extract
        mv squashfs-root AppDir
        
        # Cleanup
        rm python.AppImage

    - name: Install Application
      run: |
        # The python binary inside AppDir
        PYTHON=./AppDir/opt/python3.9/bin/python3.9
        PIP=./AppDir/opt/python3.9/bin/pip3.9
        
        # Upgrade pip and install the app forcefully to ensure latest code
        $PYTHON -m pip install --upgrade pip
        $PIP install --force-reinstall --no-cache-dir .
        
        # Install PySide6 explicitly if needed? No, setup.py handles it.
        # Note: PySide6 might need libxcb libs which might be missing in manylinux2014 base?
        # Usually they bundle correct wheels.

    - name: Configure AppDir
      run: |
        # Copy Icons & Desktop file
        cp -f tunnelflare.desktop AppDir/
        cp -f tunnelflare_gui/resources/tray.svg AppDir/tunnelflare.svg
        ln -sf tunnelflare.svg AppDir/.DirIcon
        sed -i 's/Icon=tray/Icon=tunnelflare/' AppDir/tunnelflare.desktop
        
        # IMPORTANT: Purge ALL existing AppRun files (root and usr/bin)
        # The Niess image has a symlink at root -> usr/bin/AppRun.
        # We must delete both to be safe.
        find AppDir -name AppRun -delete
        
        # Create a bulletproof root-level AppRun
        cat > AppDir/AppRun <<'EOF'
        #!/bin/bash
        # Get absolute path to the AppImage mount point (the root of AppDir)
        HERE=$(dirname "$(readlink -f "$0")")

        # Setup Python and App Environment
        export PYTHONHOME="$HERE/opt/python3.9"
        # We REMOVE $HERE from PYTHONPATH to ensure it only uses the installed site-packages
        export PYTHONPATH="$HERE/opt/python3.9/lib/python3.9/site-packages"
        export PATH="$HERE/opt/python3.9/bin:$PATH"
        
        # Qt/PySide6 specific library paths
        export LD_LIBRARY_PATH="$HERE/opt/python3.9/lib:$HERE/opt/python3.9/lib/python3.9/site-packages/PySide6/Qt/lib:$LD_LIBRARY_PATH"
        
        # Ensure X11/Display authorization is passed if available
        if [ -z "$XAUTHORITY" ] && [ -e "$HOME/.Xauthority" ]; then
            export XAUTHORITY="$HOME/.Xauthority"
        fi
        
        # Fix for some Linux distros where Qt might have issues with shared memory
        export QT_X11_NO_MITSHM=1

        # Run via python module
        # Our main.py is installed into site-packages via 'pip install .'
        exec "$HERE/opt/python3.9/bin/python3.9" -m main "$@"
        EOF
        
        chmod +x AppDir/AppRun

    - name: Package AppImage
      env:
        ARCH: x86_64
      run: |
        ./appimagetool-x86_64.AppImage AppDir TunnelFlare-x86_64.AppImage

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TunnelFlare-AppImage
        path: TunnelFlare*.AppImage
