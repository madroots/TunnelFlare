[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnelflare"
version = "1.0.0"
description = "A modern GUI for Cloudflare Tunnels"
readme = "README.md"
authors = [
  { name = "TunnelFlare Team" },
]
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.5.0",
    "qrcode>=7.4.2",
    "Pillow>=10.0.0"
]

[project.scripts]
tunnelflare = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "gui*", "main.py"]
